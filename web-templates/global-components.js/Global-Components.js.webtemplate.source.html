<script id="Global-Components" type="text/babel">
  const { useState, useEffect, useRef } = React;

  const Loader = () => {
    const style = { marginTop: '20px', fontSize: '18px', color: '#006455', fontWeight: 'bold' }
    return (
      <div className="loader-container">

        <p style={style}>טוען נתונים...</p>

    );

  /* ------------------------- StatusCard  ------------------------- */

  const StatusCard = ({
    title,
    content,    // יכול להיות מספר או string
    subtitle,   // ← חדש! טקסט נוסף מתחת ל-content
    icon,
    iconClass,
    link,
    style,
    className
  }) => {
    let parsedStyle = {};
    if (typeof style === "string") {
      try {
        parsedStyle = JSON.parse(style);
      } catch (e) {
        console.error("Style parsing failed:", e);
      }
    } else if (typeof style === "object") {
      parsedStyle = style;
    }

    const handleClick = () => {
      if (link) {
        window.location.href = link;
      }
    };

    // בדיקה אם מדובר במספר או טקסט
    const isNumber = typeof content === "number";

    return (
      <div
        className={`statusCard ${className}`}
        style={parsedStyle}
        {...(link ? { onClick: handleClick } : {})}
      >

        <div className="card-details">

          <h3>{title}</h3>
          {content !== undefined && (
            <p className={isNumber ? "numberbutton" : "textbutton"}>
              {content}
            </p>
          )}
          {subtitle && (
            <div className="card-subtitle">{subtitle}</div>
          )}
        </div>
        {(icon || iconClass) && (
          <div className="new-card-icon">
            {iconClass ? <i className={iconClass}></i> : icon}
          </div>
        )}
      </div>

    );
  };

  /* ------------------------- Tag Component ------------------------- */
  const Tag = ({ tag }) => {
    if (!tag) return null;

    const hexToRgba = (hex, alpha) => {
      if (!hex) return `rgba(247, 227, 178, ${alpha})`;
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

    const darkenColor = (hex, amount = 0.2) => {
      if (!hex) return '#D9C090';
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      let r = parseInt(hex.slice(0, 2), 16);
      let g = parseInt(hex.slice(2, 4), 16);
      let b = parseInt(hex.slice(4, 6), 16);
      r = Math.max(0, Math.floor(r * (1 - amount)));
      g = Math.max(0, Math.floor(g * (1 - amount)));
      b = Math.max(0, Math.floor(b * (1 - amount)));
      return `rgb(${r}, ${g}, ${b})`;
    };

    const tagStyle = {
      backgroundColor: hexToRgba(tag.color, 0.12),
      color: darkenColor(tag.color, 0.3),
    };

    return (
      <span className="tag" style={tagStyle}>
        {tag.label}
      </span>
    );
  };

  /* ------------------------- Role Toggle Component ------------------------- */
  const RoleToggle = () => {
    const dispatch = useDispatch();
    const { userRoles, currentRole } = useSelector((state) => state?.user);

    // Only show if user has BOTH roles
    if (!userRoles.coordinator || !userRoles.leader) {
      return null;
    }

    const handleToggle = (role) => {
      dispatch({ type: 'user/setCurrentRole', payload: role });
    };

    return (
      <div className="role-toggle-container">
        <div className="role-toggle-buttons">
          <button
            className={`role-toggle-btn ${currentRole === 'leader' ? 'active' : ''}`}
            onClick={() => handleToggle('leader')}
          >
            הקבוצה שלי
          </button>
          <button
            className={`role-toggle-btn ${currentRole === 'coordinator' ? 'active' : ''}`}
            onClick={() => handleToggle('coordinator')}
          >
            הקן שלי
          </button>
        </div>
      </div>
    );
  };

  /* ------------------------- Group Selector Component ------------------------- */
  const GroupSelector = () => {
    const dispatch = useDispatch();
    const { roles, currentKnId, currentGroupId } = useSelector((state) => state?.user);

    // Get all groups from roles
    const activeKnId = currentKnId || (roles && Object.keys(roles).length > 0 ? Object.keys(roles)[0] : null);
    const currentKnData = (roles && activeKnId && roles[activeKnId]) ? roles[activeKnId] : null;

    if (!currentKnData) return null;

    // Extract unique groups from rolesOptions
    const groupsMap = {};
    if (currentKnData.rolesOptions) {
      currentKnData.rolesOptions.forEach(roleOption => {
        if (roleOption.groupId && roleOption.groupName && roleOption.roleLabel === 'leader') {
          groupsMap[roleOption.groupId] = roleOption.groupName;
        }
      });
    }

    const groups = Object.entries(groupsMap).map(([id, name]) => ({ id, name }));

    // If no groups, return null
    if (groups.length === 0) return null;

    // If only one group, display static text
    if (groups.length === 1) {
      const knName = currentKnData.name || '';
      const groupName = groups[0].name || '';
      return (
        <p className="location-context-static">
          {knName} / {groupName}
        </p>
      );
    }

    // Multiple groups: show dropdown
    const handleGroupChange = (e) => {
      dispatch({ type: 'user/setCurrentGroupId', payload: e.target.value });
    };

    const selectedGroupId = currentGroupId || groups[0].id;

    return (
      <div className="location-selector-container">
        <select
          className="location-selector-dropdown"
          value={selectedGroupId}
          onChange={handleGroupChange}
        >
          {groups.map(group => (
            <option key={group.id} value={group.id}>
              {currentKnData.name} / {group.name}
            </option>
          ))}
        </select>
      </div>
    );
  };

  /* ------------------------- KN Selector Component ------------------------- */

    const dispatch = useDispatch();
    const { roles, currentKnId } = useSelector((state) => state?.user);

    // Multiple KNs: show dropdown
    const handleKnChange = (e) => {

  /* ------------------------- Chat Component ------------------------- */
  const Chat = ({ setShowChat }) => {
    console.log("Chat component LOADED", new Date());

    const { firstName } = useSelector((state) => state?.user);

    const [messages, setMessages] = React.useState([
      {
        id: 1,
        sender: 'assistant',
        text: `שלום ${firstName}, אני העוזר הוירטואלי של תנועת השומר החדש.\nאיך אוכל לעזור לך היום?`,
        timestamp: new Date()
      }
    ]);

    const [inputMessage, setInputMessage] = React.useState('');
    const [isLoading, setIsLoading] = React.useState(false);

    // קריאה ל-Power Pages Flow
    const callFlowOpenAI = async (userText) => {
      try {
        const response = await webapi.safeAjax({
          type: "POST",
          contentType: "application/json",
          url: "/_api/cloudflow/v1.0/trigger/12bc43cb-47cf-f011-bbd3-7ced8d2d9871",
          // data: JSON.stringify({
          //   eventData: {
          //     promprt: userText
          //   }
          // }),
          data: JSON.stringify({
            text: userText
          }),
          processData: false,
          global: false
        });


        const parsed = typeof response === "string" ? JSON.parse(response) : response;
        return parsed.answer;


      } catch (err) {
        console.error("Flow error:", err);
        throw err;
      }
    };


    const handleSendMessage = async (e) => {
      if (e && e.preventDefault) e.preventDefault();

      const msg = inputMessage.trim();
      if (!msg || isLoading) return;

      setMessages(prev => [
        ...prev,
        {
          id: prev.length + 1,
          sender: 'user',
          text: msg,
          timestamp: new Date()
        }
      ]);

      setInputMessage('');
      setIsLoading(true);

      try {
        const answer = await callFlowOpenAI(msg);

        setMessages(prev => [
          ...prev,
          {
            id: prev.length + 1,
            sender: 'assistant',
            text: answer || 'לא התקבלה תשובה',
            timestamp: new Date()
          }
        ]);
      } catch (err) {
        debugger;
        setMessages(prev => [
          ...prev,
          {
            id: prev.length + 1,
            sender: 'assistant',
            text: 'אירעה שגיאה בעת הפנייה לבוט',
            timestamp: new Date()
          }
        ]);
      } finally {
        setIsLoading(false);
      }
    };

    const handleKeyDown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage();
      }
    };

    const handleTextareaChange = e => {
      setInputMessage(e.target.value);

      // Auto resize textarea
      const textarea = e.target;
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    };



    return (
      <div className="chat-panel" dir="rtl">
        <div className="chat-header">
          <span className="chat-title">העוזר הוירטואלי שלך</span>
          <button className="chat-close" onClick={() => setShowChat(false)}>×</button>
        </div>

        <div className="chat-body">
          {messages.map(m => (
            <div
              key={m.id}
              className={`chat-message ${m.sender === 'user' ? 'from-user' : 'from-assistant'}`}
            >
              {m.sender === 'assistant' && (
                <div className="assistant-avatar">
                  <img src="/chatprofile.png" alt="chat-profile" />
                </div>
              )}
              <div className="chat-bubble">{m.text}</div>
            </div>
          ))}

          {isLoading && (
            <div className="chat-message from-assistant">
              <div className="assistant-avatar">
                <img src="/chatprofile.png" alt="chat-profile" />
              </div>
              <div className="chat-bubble">חושב רגע…</div>
            </div>
          )}
        </div>

        <form className="chat-input-bar" onSubmit={handleSendMessage}>
          <div className="chat-input-wrapper">
            <textarea
              className="chat-input-textarea"
              value={inputMessage}
              onChange={handleTextareaChange}
              onKeyDown={handleKeyDown}
              placeholder="אפשר לשאול כל דבר..."
              disabled={isLoading}
            />
            <button
              type="submit"
              className="chat-send-icon"
              disabled={isLoading}
            >
              שלח
            </button>
          </div>
        </form>

      </div>
    );
  };
