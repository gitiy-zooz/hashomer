        const encodedFetch = encodeURIComponent(CleanFetchForWebAPI(fetchXML));

        webapi.safeAjax({
          type: "GET",
          url: `/_api/zooz_role_layers?fetchXml=${encodedFetch}`,
          contentType: "application/json",
          headers: {
            "Prefer": "odata.include-annotations=*"
          },
          success: function (data) {

            const activities = {};
            if (data && data.value) {
              data.value.forEach(item => {
                const knId = item['kn.zooz_knid'];
                const groupId = item["attendance.zooz_group"];

                if (knId && groupId) {
                  if (!activities[knId]) {
                    activities[knId] = {};
                  }
                  if (!activities[knId][groupId]) {
                    activities[knId][groupId] = [];
                  }

                  activities[knId][groupId].push({
                    activityId: item['zooz_activity_wheelid'],
                    name: item['zooz_name'],
                    details: item['activity.zooz_details'],
                    asPlan: item['attendance.zooz_as_plan'],
                    activityDefinitionId: item['_zooz_activity_value'],
                    activityDefinitionName: item['_zooz_activity_value@OData.Community.Display.V1.FormattedValue'],
                    startDate: item['attendance.zooz_date'],
                    formattedDate: item['attendance.zooz_date@OData.Community.Display.V1.FormattedValue'],
                  });
                }
              });
            }
            resolve({ activities });
          },
          error: function (xhr) {
            debugger
            console.error("Error fetching group students", xhr);
            reject(xhr);
          }
        });
      });

  function fetchActivities(parendCaseId) {
    debugger
    fetchXmlRecords(`https://hanoar-hashomer-dev.powerappsportals.com/fetchActivities.html`, setActivities )
  }



  const activitiesSlice = createSlice({
    name: "activities",
    initialState: {
      activities: {},

      loading: {
        global: false,
        activities: false,
      },
      error: {},
    },

    reducers: {
      setCurrentRole: (state, action) => {
        state.currentRole = action.payload;
      },
      setActivities: (state, action) => {
        state.activities = action.payload;
      },
    },
    extraReducers: (builder) => {
      builder
        .addCase(fetchActivities.pending, (state) => {
          state.loading.activities = true;
          state.error = {};
        })
        .addCase(fetchActivities.fulfilled, (state, action) => {
          state.loading.activities = false;
          state.activities = action.payload.activities;
        })
        .addCase(fetchActivities.rejected, (state, action) => {
          state.loading.activities = false;
          state.error.title = "Failed";
          state.error.message = action.payload || "Failed to load activities";
        });
    }
  });


</script>
