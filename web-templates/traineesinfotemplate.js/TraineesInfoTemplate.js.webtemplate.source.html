  const GroupFilter = ({ groups, selectedGroup, onGroupChange }) => {
    const [isOpen, setIsOpen] = useState(false);
    const dropdownRef = useRef(null);

    // Close on click outside
    useEffect(() => {
      const handleClickOutside = (event) => {
        if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
          setIsOpen(false);
        }
      };
      document.addEventListener("mousedown", handleClickOutside);
      return () => {
        document.removeEventListener("mousedown", handleClickOutside);
      };
    }, []);

    const handleSelect = (value) => {
      onGroupChange(value);
      setIsOpen(false);
    };

    // Helper to normalize group items (string or object)
    const getValue = (g) => typeof g === 'object' ? g.value : g;
    const getLabel = (g) => typeof g === 'object' ? g.label : g;

    // Find selected label
    const selectedItem = groups.find(g => getValue(g) == selectedGroup); // Loose equality for string/number mix
    const selectedLabel = selectedGroup ? (selectedItem ? getLabel(selectedItem) : selectedGroup) : "כל השכבות";

    return (
      <div className="group-filter-wrapper" ref={dropdownRef}>
        <button
          className={`group-filter-btn ${isOpen ? 'open' : ''}`}
          onClick={() => setIsOpen(!isOpen)}
        >
          <span className="group-filter-label">{selectedLabel}</span>
          <svg className="group-filter-icon" viewBox="0 0 14 9">
            <path d="M1 1L7 7L13 1" />
          </svg>
        </button>

        {isOpen && (
          <div className="group-filter-dropdown">
            <div
              className={`group-filter-item ${!selectedGroup ? 'selected' : ''}`}
              onClick={() => handleSelect("")}
            >
              כל השכבות
            </div>
            {groups.map((group) => {
              const val = getValue(group);
              const lbl = getLabel(group);
              return (
                <div
                  key={val}
                  className={`group-filter-item ${selectedGroup == val ? 'selected' : ''}`}
                  onClick={() => handleSelect(val)}
                >
                  {lbl}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  const UnifiedDataTable = ({

    }, [user, isInstructor]);

    // Get activeGroups from Redux (Global List)
    const activeGroups = useSelector(state => state.trainees?.activeGroups || []);

    // Calculate unique groups from data (Fallback)
    const uniqueGroups = React.useMemo(() => {
      const groups = data.map(item => item.group).filter(Boolean);
      return [...new Set(groups)].sort();
    }, [data]);

    // Determine which groups list to use
    // If we have global activeGroups and dataSource is trainees, use global list.
    // Determine which groups list to use
    // PRIORITIZE Metadata (activeGroups) if available.

    React.useEffect(() => {

    const filteredData = React.useMemo(() => {
      let processData = data;

      if (mode === "basic") {
        return processData.filter(item =>
          columns.some(col => {
            const value = col.accessor ? item[col.accessor] : "";
            return value && value.toString().toLowerCase().includes(searchTerm);
          })
        );
      }
      return processData.filter(item =>
        Object.values(item).some(value =>
          value && value.toString().toLowerCase().includes(searchTerm)
        )
      );

      if (newExpandedRows.has(rowId)) {

            <button

              style={handlers.getButtonStyle(row.status, status.key)}
              onClick={(e) => {

                        </svg>

                      <div className="participant-name">
                        <span className={`status-dot ${parseInt(row.attendancePercent) > 0 ? 'active' : 'inactive'}`}></span>

                      </div>

                      <i className={"fa-solid " + (isExpanded ? "fa-chevron-up" : "fa-chevron-down")}></i>
                    </div>

                    <div className="participant-actions">
                      {pageType === "activityAttendance" ? (
                        <StatusCircles row={row} />

                        <>
                          {isExpanded && (
                            <a href={"mailto:" + row.email} className="mobile-call-btn email-btn" onClick={(e) => e.stopPropagation()}>

                                <path d="M15.462 17.8121C14.6541 18.62 13.3451 18.62 12.5376 17.8121L1.58984 6.86475V20.9146C1.58984 22.052 2.52089 22.9827 3.65796 22.9827H24.3409C25.4783 22.9827 26.4097 22.052 26.4097 20.9146V6.86475L15.462 17.8121Z" fill="#1560A0" />
                                <path d="M3.05127 5.40234L13.9999 16.3497L24.9485 5.40234H3.05127Z" fill="#1560A0" />

                  {isExpanded && (
                    <div className="participant-details">

                        // עיצוב מיוחד ל-activityAttendance

                            <NoteInput trainee={row} onNoteChange={handlers.onNoteChange} />

                          {/* שורה 3: הערכת חניך/ה */}

                            <LikeButtons trainee={row} onSmileyClick={handlers.onSmileyClick} />
                            <label>הערכת חניך/ה</label>
                          </div>
*/}

                              </svg>
                            </a>
                            <WhatsAppButton phone={row.phone} />
                          </div>
                        </>

                        // עיצוב רגיל לשאר העמודים
                        <>
                          <div className="detail-row attendance-info-row">

                              {(() => {

                                let displayText = '';

                                  icon = <svg width="19" height="2" viewBox="0 0 19 2" fill="none" xmlns="http://www.w3.org/2000/svg">

                                  </svg>;
                                  displayText = '';
                                } else if (percentage >= 76) {
                                  colorClass = 'high-attendance';
                                  icon = <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">

                                  </svg>;
                                  displayText = `${percentage}%`;

                                  colorClass = 'medium-attendance';
                                  icon = <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M19.9033 14.25C19.9033 14.4323 19.8309 14.6072 19.702 14.7361C19.573 14.8651 19.3982 14.9375 19.2158 14.9375H4.09082C3.90848 14.9375 3.73362 14.8651 3.60468 14.7361C3.47575 14.6072 3.40332 14.4323 3.40332 14.25C3.40332 14.0677 3.47575 13.8928 3.60468 13.7639C3.73362 13.6349 3.90848 13.5625 4.09082 13.5625H19.2158C19.3982 13.5625 19.573 13.6349 19.702 13.7639C19.8309 13.8928 19.9033 14.0677 19.9033 14.25ZM4.09082 9.4375H19.2158C19.3982 9.4375 19.573 9.36507 19.702 9.23614C19.8309 9.1072 19.9033 8.93234 19.9033 8.75C19.9033 8.56766 19.8309 8.3928 19.702 8.26386C19.573 8.13493 19.3982 8.0625 19.2158 8.0625H4.09082C3.90848 8.0625 3.73362 8.13493 3.60468 8.26386C3.47575 8.3928 3.40332 8.56766 3.40332 8.75C3.40332 8.93234 3.47575 9.1072 3.60468 9.23614C3.73362 9.36507 3.90848 9.4375 4.09082 9.4375Z" fill="#DB992B" />
                                  </svg>;
                                  displayText = `${percentage}%`;
                                } else {
                                  colorClass = 'low-attendance';

                                  </svg>;
                                  displayText = `${percentage}%`;
                                }

                                return (
                                  <div className="attendance-container">
                                    <span className="attendance-label">{attendanceLabel}</span>
                                    <span className={`attendance-badge ${colorClass}`}>
                                      {displayText && <span className="attendance-number">{displayText}</span>}
                                      {icon}
                                    </span>
                                  </div>
                                );
                              })()}
                            </div>

                            {showParentInfo && (
                              <div className="detail-row info-row">
                                <div className="info-item">
                                  <span className="age-row">גיל</span>
                                  <span className="info-value">{row.age}</span>
                                </div>
                              </div>
                            )}
                          </div>

                          {showParentInfo && row.parentName && (
                            <div className="detail-row parent-row">
                              <div className="parent-row">
                                <span className="parent-label">הורה</span>
                                <span className="parent-name">{row.parentName}</span>
                              </div>

                                  <svg width="28" height="28" viewBox="0 0 28 29" fill="none" xmlns="http://www.w3.org/2000/svg">

                                  </svg>
                                </a>
                              </div>
                            </div>
                          )}

                          {mode === "advanced" && (
                            <>
                              <div className="detail-row">
                                <label>סטטוס נוכחות:</label>
                                <StatusButtons
                                  trainee={row}
                                  onStatusClick={handlers.onStatusClick}
                                  getButtonStyle={handlers.getButtonStyle}
                                />
                              </div>

                              <div className="detail-row">
                                <label>הערות:</label>
                                <NoteInput trainee={row} onNoteChange={handlers.onNoteChange} />
                              </div>

                              <div className="detail-row actions-row">
                                <div className="detail-group">
                                  <label>הערכה:</label>
                                  <LikeButtons trainee={row} onSmileyClick={handlers.onSmileyClick} />
                                </div>
                                <div className="detail-group">
                                  <label>יצא/ה מוקדם:</label>
                                  <CheckButton trainee={row} onCheckClick={handlers.onCheckClick} />
                                </div>
                                <div className="whatsapp">

                                </div>
                              </div>
                            </>
                          )}

                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    return (
      <div className="tableParticipants desktop-table">
        <div className="presence-table-header">
          <div className="presence-header-row">
            <div className="presence-header-title-div">
              <p className="presence-header-title">{title}</p>
            </div>
            <div className="presence-header-filter">
              {customFilters ? (
                customFilters
              ) : (
                !isInstructor && (
                  <GroupFilter
                    groups={displayGroups}
                    selectedGroup={selectedGroup}
                    onGroupChange={setSelectedGroup}
                  />
                )
              )}
              <SearchBar
                search={search}
                setSearch={setSearch}
                placeholder={searchPlaceholder || "חיפוש..."}
              />
            </div>
          </div>
        </div>

        <table>
          <thead className="titlesTable">
            <tr>
              {columns.map((column, index) => (
                <th key={index}>{column.header}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filteredData.map((row) => (
              <tr
                key={row.id}
                onClick={onRowClick ? () => onRowClick(row) : undefined}
              >
                {columns.map((column, colIndex) => (
                  <td key={colIndex}>
                    {column.render
                      ? column.render(row, mode === "advanced" ? handlers : undefined)
                      : row[column.accessor]}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

</script>
