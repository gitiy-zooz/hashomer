<div id="root"></div>
<script type="text/babel">
  const ResetPasswordPage = () => {
      const [newPassword, setNewPassword] = React.useState('');
      const [confirmPassword, setConfirmPassword] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');

      const handleSubmit = (e) => {
          e.preventDefault();
          setError('');

          if (newPassword !== confirmPassword) {
              setError('הסיסמאות אינן תואמות');
              return;
          }

          if (newPassword.length < 6) {
              setError('הסיסמה חייבת להכיל לפחות 6 תווים');
              return;
          }

          setLoading(true);

          // כאן תוסיפי את הלוגיקה של איפוס הסיסמא
          console.log('New Password:', newPassword);

          // דוגמה - לאחר עדכון מוצלח:
          // alert('הסיסמה עודכנה בהצלחה');
          // window.location.href = '/sign-in';
      };

      return (
          <div className="login-page">
              <div className="login-right">
                  <div className="logo-container">
                      <img src="/נוער השומר 1.png" alt="נוער השומר 1" name="נוער השומר 1.png"/>
                  </div>

                  <div className="login-form-container">
                      <h1 className="login-title">איפוס סיסמה</h1>

                      {error && (
                          <div className="error-message">
                              {error}
                          </div>
                      )}

                      <form onSubmit={handleSubmit} className="login-form">
                          <div className="form-group">
                              <label htmlFor="new-password">סיסמה חדשה</label>
                              <input
                                  type="password"
                                  id="new-password"
                                  value={newPassword}
                                  onChange={(e) => setNewPassword(e.target.value)}
                                  required
                              />
                          </div>

                          <div className="form-group">
                              <label htmlFor="confirm-password">סיסמה חדשה פעם נוספת</label>
                              <input
                                  type="password"
                                  id="confirm-password"
                                  value={confirmPassword}
                                  onChange={(e) => setConfirmPassword(e.target.value)}
                                  required
                              />
                          </div>

                          <div className="bottomButtons">
                              <button type="submit" className="btn-submit" disabled={loading}>
                                  {loading ? 'מעדכן...' : 'עדכון'}
                              </button>
                          </div>
                      </form>
                  </div>
              </div>

              <div className="login-left">
                  <div className="illustration">
                      <img src="/bg.png" alt="background" className="bg-image" />
                      <img src="/kids.png" alt="kids" className="kids-image" />
                  </div>
              </div>
          </div>
      );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ResetPasswordPage />);
</script>
<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;"><div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;"></div></div>
</div>
