      const base64Data = await fileToBase64(fileData.file || new Blob());

      const mockDataverseRecord = {
        entityName: 'hashomer_activityfiles',
        data: {
          'hashomer_filename': fileData.name,
          'hashomer_filesize': fileData.size,
          'hashomer_filetype': fileData.type,

          'hashomer_uploaddate': new Date().toISOString(),

        }
      };

      console.log('שמירה ב-Dataverse:', mockDataverseRecord);
      return mockDataverseRecord;
    };

    const fileToBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });

    // Save to Dataverse helper function using webapi.safeAjax
    const saveAttendanceToDataverse = (participantId, updates) => {
      console.log('=== saveAttendanceToDataverse called ===');
      console.log('participantId:', participantId, 'type:', typeof participantId);
      console.log('updates:', updates);
      
      if (typeof webapi === 'undefined' || typeof webapi.safeAjax !== 'function') {
        alert('❌ שגיאה: מערכת ה-API לא זמינה');
        console.error('webapi is undefined or safeAjax not available');
        return;
      }

      if (!participantId || typeof participantId !== 'string') {
        alert('❌ שגיאה: מזהה משתתף לא תקין');
        console.error('Invalid participantId:', participantId);
        return;
      }

      const url = `/_api/zooz_attendances(${participantId})`;
      const jsonString = JSON.stringify(updates);
      console.log('API URL:', url);
      console.log('JSON payload:', jsonString);
      
      const headers = {
        "OData-MaxVersion": "4.0",
        "OData-Version": "4.0",
        "Accept": "application/json",
        "If-Match": "*"
      };

      webapi.safeAjax({
        type: "PATCH",
        url: url,
        contentType: "application/json",
        data: jsonString,
        headers: headers,
        success: function (data) {
          console.log('✅ Save successful:', data);
          // Refresh participants data to show updated values
          if (activityId && window.fetchParticipantsData) {
            dispatch(window.fetchParticipantsData({ activityId }));
          }
        },
        error: function (xhr) {
          console.error('❌ Save failed');
          console.error('Status:', xhr.status);
          console.error('Status Text:', xhr.statusText);
          console.error('Response:', xhr.responseText);
          
          let errorMessage = 'אירעה תקלה בשמירת הנתונים';
          try {
            const errorData = JSON.parse(xhr.responseText);
            console.error('Parsed error:', errorData);
            if (errorData.error && errorData.error.message) {
              errorMessage += ': ' + errorData.error.message;
            }
          } catch (e) {
            if (xhr.statusText) {
              errorMessage += ': ' + xhr.statusText;
            }
          }
          alert('❌ ' + errorMessage);
        }
      });
    };
