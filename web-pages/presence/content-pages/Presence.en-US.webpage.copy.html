<!-- Ensure React and ReactDOM are loaded -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script type="text/babel">

  const ActivityAttendancePage = () => {
    const [search, setSearch] = React.useState('');
    const [attachedFiles, setAttachedFiles] = React.useState([]);
    const [trainees, setTrainees] = React.useState([]);

    const { useSelector, useDispatch } = window.ReactRedux;
    const { data } = useSelector(state => state.trainees);

    const dispatch = useDispatch();

    const loadAttachedFiles = async () => {
      try {
        const demoFiles = [
          { id: 1, name: 'תמונה_פעילות.jpg', size: '2.3MB', type: 'image' },
          { id: 2, name: 'סיכום_יום.pdf', size: '1.1MB', type: 'document' },
          { id: 3, name: 'רשימת_נוכחים.xlsx', size: '854KB', type: 'spreadsheet' }
        ];
        setAttachedFiles(demoFiles);
      } catch (error) {
        console.error('שגיאה בטעינת קבצים:', error);
      }
    };

    React.useEffect(() => {
      loadAttachedFiles();
    }, []);

    React.useEffect(() => {
      setTrainees(data);
    }, [data]);

    const presentCount = React.useMemo(() =>
      trainees.filter(p => p.status === "נוכח").length,
      [trainees]
    );

    const attendanceRate = React.useMemo(() =>
      trainees.length > 0 ? Math.round((presentCount / trainees.length) * 100) : 0,
      [trainees.length, presentCount]
    );

    const earlyLeaveCount = React.useMemo(() =>
      trainees.filter(p => p.checked).length,
      [trainees]
    );

    const handleFilesCardClick = () => {
      console.log('נלחץ על כרטיס הקבצים');
    };

    const handleStatusClick = (id, newStatus) => {
      dispatch(updateTraineeStatus({ id, status: newStatus }));
    };

    const handleNoteChange = (id, value) => {
      dispatch(updateTraineeNote({ id, note: value }));
    };

    const handleCheckClick = id => {
      dispatch(updateTraineeCheck({ id }));
    };

    const handleLikeClick = (id, value) => {
      dispatch(updateTraineeLike({ id, like: value }));
    };

    const getButtonStyle = (currentStatus, buttonStatus) => {
      if (currentStatus === buttonStatus) {
        if (buttonStatus === "נוכח") return { background: "#CFEDD9", color: "#2D5A3A", border: "2px solid #B6DEC3" };
        if (buttonStatus === "חיסור") return { background: "#FEE2E2", color: "#8B1538", border: "2px solid #F5C8C8" };
        if (buttonStatus === "איחור") return { background: "#F7DDA7", color: "#8B6914", border: "2px solid #F2CF87" };
      }
      return { background: "#e0e0e0", color: "#333", border: "1px solid #ccc" };
    };

    const handleFinishActivity = () => {
      const summary = {
        totalTrainees: trainees.length,
        presentCount,
        attendanceRate,
        earlyLeaveCount,
        notes: trainees.filter(p => p.note && p.note.trim()).length
      };
      console.log('סיום פעילות - סיכום:', summary);
    };

    const columns = [
      {
        header: "שם",
        accessor: "name"
      },
      {
        header: "טלפון",
        accessor: "phone",
        render: (trainee) => (
          <div className="phone-cell">
            <span>{trainee.phone}</span>
            <WhatsAppButton phone={trainee.phone} />
          </div>
        )
      },
      {
        header: "סטטוס",
        render: (trainee, handlers) => (
          <StatusButtons
            trainee={trainee}
            onStatusClick={handlers.onStatusClick}
            getButtonStyle={handlers.getButtonStyle}
          />
        )
      },
      {
        header: "הערות",
        render: (trainee, handlers) => (
          <NoteInput
            trainee={trainee}
            onNoteChange={handlers.onNoteChange}
          />
        )
      },
      {
        header: "הערכה",
        render: (trainee, handlers) => (
          <LikeButtons
            trainee={trainee}
            onLikeClick={handlers.onLikeClick}
          />
        )
      },
      {
        header: "יצא/ה מוקדם",
        render: (trainee, handlers) => (
          <CheckButton
            trainee={trainee}
            onCheckClick={handlers.onCheckClick}
          />
        )
      }
    ];

    return (

      <div className="bigContentDiv activity-attendance-page">
        <SidebarMenu />
        {/* <div className="containerPage">*/}
        <div className="titleDiv">
          <h1 id="titleText">יום המעשים הטובים</h1>
          <button id="titleButton" onClick={handleFinishActivity}>
            סיום פעילות
          </button>
        </div>
        <div className="divTopText">
          <p id="topText">24 אוג'~שעה 09:00-18:00 סניף נהריה</p>
        </div>
        <div className="divContent">
          <div className="divLessonInformation">
            <div className="divAttachments">
              <p id="textlessoninformationAttachments">קבצים מצורפים</p>
              <i className="fa-regular fa-file" aria-hidden="true"></i>
            </div>

              </svg>
              }
              className="events-card bg-gold"
              style='{"width": "100%"}'

            />

            <StatusCard
              title="הגיעו"
              number={presentCount}
              icon={<svg width="20" height="15" viewBox="0 0 20 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.1738 1.92195L7.17383 13.922C7.06931 14.0268 6.94512 14.11 6.80837 14.1668C6.67163 14.2236 6.52502 14.2528 6.37695 14.2528C6.22889 14.2528 6.08228 14.2236 5.94553 14.1668C5.80878 14.11 5.68459 14.0268 5.58008 13.922L0.330076 8.67195C0.225429 8.56731 0.142419 8.44307 0.085784 8.30634C0.0291494 8.16961 1.55936e-09 8.02307 0 7.87508C-1.55936e-09 7.72708 0.0291494 7.58054 0.085784 7.44381C0.142419 7.30708 0.225429 7.18285 0.330076 7.0782C0.434724 6.97356 0.558958 6.89054 0.695686 6.83391C0.832414 6.77728 0.978958 6.74812 1.12695 6.74812C1.27494 6.74812 1.42149 6.77728 1.55822 6.83391C1.69495 6.89054 1.81918 6.97356 1.92383 7.0782L6.37789 11.5323L17.582 0.330076C17.7933 0.118732 18.0799 0 18.3788 0C18.6777 0 18.9644 0.118732 19.1757 0.330076C19.387 0.541421 19.5058 0.828065 19.5058 1.12695C19.5058 1.42584 19.387 1.71248 19.1757 1.92383L19.1738 1.92195Z" fill="white" />
              </svg>
              }
              className="events-card bg-blue"
              style='{"width": "100%"}'           
            />

            <StatusCard
              title="שיעור הנוכחות"
              number={attendanceRate + "%"}
              icon={<svg width="23" height="17" viewBox="0 0 23 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.9951 11.7862C13.1708 11.054 14.076 9.9587 14.5738 8.66613C15.0716 7.37357 15.1349 5.95404 14.7541 4.6223C14.3733 3.29057 13.5691 2.11909 12.4632 1.2851C11.3573 0.451118 10.0099 0 8.62476 0C7.23965 0 5.89222 0.451118 4.78632 1.2851C3.68043 2.11909 2.87624 3.29057 2.49543 4.6223C2.11461 5.95404 2.17789 7.37357 2.67569 8.66613C3.17349 9.9587 4.07873 11.054 5.25444 11.7862C3.31851 12.42 1.57663 13.6041 0.176007 15.2709C0.0479568 15.4232 -0.0143506 15.6202 0.00279137 15.8184C0.0199334 16.0166 0.115121 16.1999 0.267413 16.328C0.419705 16.456 0.616628 16.5183 0.814859 16.5012C1.01309 16.484 1.19639 16.3889 1.32444 16.2366C3.20601 13.9903 5.79913 12.7538 8.62007 12.7538C11.441 12.7538 14.0341 13.9903 15.9204 16.2366C16.0484 16.3889 16.2317 16.484 16.43 16.5012C16.6282 16.5183 16.8251 16.456 16.9774 16.328C17.1297 16.1999 17.2249 16.0166 17.242 15.8184C17.2592 15.6202 17.1969 15.4232 17.0688 15.2709C15.6682 13.6041 13.9263 12.42 11.9951 11.7862ZM3.74507 6.37875C3.74507 5.41457 4.03098 4.47203 4.56665 3.67035C5.10233 2.86866 5.8637 2.24381 6.75449 1.87484C7.64528 1.50586 8.62548 1.40932 9.57113 1.59742C10.5168 1.78552 11.3854 2.24982 12.0672 2.9316C12.749 3.61338 13.2133 4.48203 13.4014 5.42768C13.5895 6.37334 13.493 7.35354 13.124 8.24433C12.755 9.13512 12.1302 9.89649 11.3285 10.4322C10.5268 10.9678 9.58425 11.2537 8.62007 11.2537C7.3276 11.2523 6.08848 10.7382 5.17457 9.82425C4.26065 8.91033 3.74656 7.67122 3.74507 6.37875ZM22.2757 9.53438L19.2757 12.5344C19.206 12.6041 19.1233 12.6594 19.0323 12.6972C18.9412 12.7349 18.8436 12.7543 18.7451 12.7543C18.6465 12.7543 18.5489 12.7349 18.4579 12.6972C18.3668 12.6594 18.2841 12.6041 18.2144 12.5344L16.7144 11.0344C16.5737 10.8936 16.4947 10.7028 16.4947 10.5037C16.4947 10.3047 16.5737 10.1139 16.7144 9.97312C16.8552 9.83239 17.046 9.75333 17.2451 9.75333C17.4441 9.75333 17.635 9.83239 17.7757 9.97312L18.7451 10.9434L21.2144 8.47312C21.3552 8.33239 21.546 8.25333 21.7451 8.25333C21.9441 8.25333 22.135               }
                className="events-card bg-green"
              style='{"width": "100%"}'
            />
          </div>


          <UnifiedDataTable
            columns={columns}
            title="משתתפים/ות"
            search={search}
            setSearch={setSearch}
            searchPlaceholder="חיפוש חניך/ה..."
            mode="advanced"
            onStatusClick={handleStatusClick}
            onNoteChange={handleNoteChange}
            onCheckClick={handleCheckClick}
            onLikeClick={handleLikeClick}
            getButtonStyle={getButtonStyle}
            className="table-with-updated-styling"
          />
        </div>
      </div>



    );
  };

  const rootElement = document.getElementById("root");
  if (rootElement) {
    const AppWithProvider = () => (
      <ReactRedux.Provider store={store}>
        <ActivityAttendancePage />
      </ReactRedux.Provider>
    );

    if (ReactDOM.createRoot) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<AppWithProvider />);
    } else {
      ReactDOM.render(<AppWithProvider />, rootElement);
    }
  }

</script>

<div class="sectionBlockLayout">
  <div class="container container-full">
    <div>
      <div id="root"></div>
    </div>
  </div>
</div>
