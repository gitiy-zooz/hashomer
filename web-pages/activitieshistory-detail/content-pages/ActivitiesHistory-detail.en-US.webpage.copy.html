        const link = document.createElement('a');
        link.href = file.url || '#';
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
      console.log("Downloading all files:", allFiles);
    };

    const handleUploadFiles = () => {
      document.getElementById('file-upload-input').click();
    };

    const handleShare = async () => {
      // בדיקה אם יש קבצי מדיה
      if (!mediaFiles || mediaFiles.length === 0) {
        alert('אין קבצי מדיה זמינים לשיתוף');
        return;
      }

      // בדיקה אם יש Web Share API (עובד על Android ו-iPhone)
      if (!navigator.share) {
        alert('הדפדפן שלך לא תומך בשיתוף קבצים');
        return;
      }

      try {
        // המרת URLs לקבצי File objects
        const filePromises = mediaFiles.map(async (file) => {
          try {
            const response = await fetch(file.url);
            const blob = await response.blob();
            return new File([blob], file.name, { type: blob.type });
          } catch (error) {
            console.error('שגיאה בטעינת קובץ:', file.name, error);
            return null;
          }
        });

        const files = (await Promise.all(filePromises)).filter(f => f !== null);

        if (files.length === 0) {
          alert('לא ניתן לטעון את קבצי המדיה לשיתוף');
          return;
        }

        // שיתוף הקבצים בלבד
        await navigator.share({
          files: files
        });
        
        console.log('שותף בהצלחה!');
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error('שגיאה בשיתוף:', error);
          alert('לא ניתן לשתף את הקבצים');
        }
      }
    };
