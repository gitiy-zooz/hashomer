  // Calculate overall attendance percentage for past month
  const useOverallAttendanceStats = () => {
    const [attendancePercent, setAttendancePercent] = React.useState("0%");

    React.useEffect(() => {
      const calculateAttendance = async () => {
        if (typeof webapi === 'undefined' || typeof webapi.safeAjax !== 'function') {
          setAttendancePercent("N/A");
          return;
        }

        try {
          // Get current month date range
          const today = new Date();
          const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

          // Fetch all attendance records with activity data
          const response = await new Promise((resolve, reject) => {
            webapi.safeAjax({
              type: "GET",
              url: "/_api/zooz_attendances?" + "$" + "expand=zooz_activity(" + "$" + "select=zooz_from)",
              contentType: "application/json",
              success: (data) => resolve(data),
              error: (xhr) => reject(xhr)
            });
          });

          const allAttendances = response.value || [];

          // Filter by current month in JavaScript
          const attendances = allAttendances.filter(a => {
            if (!a._zooz_activity_value) return false; // No linked activity

            // If we have expanded activity data with date
            if (a.zooz_activity && a.zooz_activity.zooz_from) {
              const activityDate = new Date(a.zooz_activity.zooz_from);
              return activityDate >= firstDayOfMonth && activityDate <= today;
            }

            return true; // Include if we can't determine date
          });

          if (attendances.length === 0) {
            setAttendancePercent("0%");
            return;
          }

          // Count Present (696480000) and Late (696480002) as attended
          const attended = attendances.filter(a =>
            a.zooz_status_p === "696480000" || a.zooz_status_p === "696480002" ||
            a.zooz_status_p === 696480000 || a.zooz_status_p === 696480002
          ).length;

          const percentage = Math.round((attended / attendances.length) * 100);
          setAttendancePercent(percentage + "%");
        } catch (error) {
          setAttendancePercent("N/A");
        }
      };

      calculateAttendance();
    }, []);

    return attendancePercent;
  };

    // Load user data from API on mount
    useEffect(() => {
      if (contactId) {
        if (rolesList.length === 0 && !userLoading.roles) {
          dispatch(fetchUserRoles());

          dispatch(fetchUserGroups());
        }
      }

    useEffect(() => {
      const handleResize = () => {

      return () => window.removeEventListener("resize", handleResize);
    }, []);


    // Get user data and permissions with debug logging
    const currentUser = useSelector(state => state?.user?.user || null);

      const user = state?.user?.user;
      return user?.contactType == 14 || Number(user?.contactType) === 14;

    const isCoordinator = useSelector(state => {
      const user = state?.user?.user;
      return user?.contactType == 38 || Number(user?.contactType) === 38;

                  style='{"background": "linear-gradient(261.4deg, #006455 24.82%, #15AD96 101.57%)", "width": "50%"}'
                />
              </div>



              {/* Bottom Section */}
              <div className="bottom-section">
                {/* Calendar */}
                {!isMobile && <CalendarSection isMobile={isMobile} />}

                {/* Right Sidebar */}
                <div className="right-sidebar">
                  <div className="sidebar-section">
                    <RecentActivities />
                  </div>
                  {isMobile && <CalendarSection isMobile={isMobile} />}
                  <div className="stats-section">
                    <TraineesStats />
                  </div>
                </div>
              </div>
            </main>
          </div>
        </div>
      </div>
    )
  }

  // Note: CalendarGrid component removed - replaced by FullCalendar (ActivityCalendar)

  // Wait for Redux store to be available and render the app
  const renderApp = () => {
    const rootElement = document.getElementById("root");

    // Use global store if local store is not available
    const storeToUse = typeof store !== 'undefined' ? store : window.store;

    if (rootElement && !rootElement._reactRoot) {
      const root = ReactDOM.createRoot(rootElement);
      rootElement._reactRoot = root;
      root.render(
        <Provider store={storeToUse}>
          <HomePageNew />
        </Provider>
      );
    } else if (rootElement && rootElement._reactRoot) {
      // Use existing root
      rootElement._reactRoot.render(
        <Provider store={storeToUse}>
          <HomePageNew />
        </Provider>
      );
    }
  };

  // Start the render process
  // renderApp();


  const rootElement = document.getElementById("root");
  const root = ReactDOM.createRoot(rootElement);
  root.render(
    <Provider store={store}>
      <HomePageNew />
    </Provider>
  );
</script>
