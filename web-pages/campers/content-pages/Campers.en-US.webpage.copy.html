      if (activeTrainees.length > 0) {
        const totalAttendance = activeTrainees.reduce((sum, trainee) => {
          return sum + (parseInt(trainee.attendancePercent) || 0);
        }, 0);
        const avgAttendance = Math.round(totalAttendance / activeTrainees.length);
        setCurrentMonthAttendance(`${avgAttendance}%`);
