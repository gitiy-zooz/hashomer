  // Editable Field Component
  const EditableField = ({ label, value, fieldName, onSave, type = "text", isTextarea = false, canEdit = true }) => {
    const [isEditing, setIsEditing] = useState(false);
    const [editValue, setEditValue] = useState(value);
    const [isSaving, setIsSaving] = useState(false);
    const inputRef = useRef(null);

    // Reset edit value when prop value changes
    useEffect(() => {
      setEditValue(value);
    }, [value]);

    // Focus input when entering edit mode
    useEffect(() => {
      if (isEditing && inputRef.current) {
        inputRef.current.focus();
      }
    }, [isEditing]);

    const handleEdit = () => {
      setIsEditing(true);
    };

    const handleSave = async () => {
      setIsSaving(true);
      try {
        await onSave(fieldName, editValue);
        setIsEditing(false);
      } catch (error) {
        console.error('Error saving field:', error);
        alert('שגיאה בשמירת השדה');
      } finally {
        setIsSaving(false);
      }
    };

    const handleCancel = () => {
      setEditValue(value);
      setIsEditing(false);
    };

    const handleKeyDown = (e) => {
      if (e.key === 'Enter' && !isTextarea) {
        e.preventDefault();
        handleSave();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        handleCancel();
      }
    };

    return (
      <div className="form-field">
        <label>{label}</label>
        <div className={`input-wrapper ${isEditing ? 'editing' : ''}`}>
          {/* Display field - shows when not editing */}
          {!isEditing && (
            <div className="display-value">
              {value || '—'}
            </div>
          )}

          {/* Edit mode - shows input at half width with action buttons */}
          {isEditing && (
            <div className="edit-controls">
              {isTextarea ? (
                <textarea
                  ref={inputRef}
                  value={editValue}
                  onChange={(e) => setEditValue(e.target.value)}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving}
                  className="edit-input"
                />
              ) : (
                <input
                  ref={inputRef}
                  type={type}
                  value={editValue}
                  onChange={(e) => setEditValue(e.target.value)}
                  onKeyDown={handleKeyDown}
                  disabled={isSaving}
                  className="edit-input"
                />
              )}

                  className="action-btn save-btn"
                  onClick={handleSave}
                  disabled={isSaving}
                  aria-label="שמירה"

            colorClass = 'high-attendance';
            icon = <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.02843 5.32275V10.8228C2.02843 11.0051 2.10086 11.18 2.22979 11.3089C2.35872 11.4378 2.53359 11.5103 2.71593 11.5103C2.89826 11.5103 3.07313 11.4378 3.20206 11.3089C3.33099 11.18 3.40343 11.0051 3.40343 10.8228V6.98221L10.4795 14.0592C10.5434 14.1231 10.6192 14.1738 10.7027 14.2084C10.7861 14.243 10.8756 14.2608 10.9659 14.2608C11.0563 14.2608 11.1457 14.243 11.2292 14.2084C11.3127 14.1738 11.3885 14.1231 11.4523 14.0592L14.4034 11.1072L20.1045 16.8092C20.2335 16.9382 20.4085 17.0106 20.5909 17.0106C20.7734 17.0106 20.9483 16.9382 21.0773 16.8092C21.2063 16.6802 21.2788 16.5052 21.2788 16.3228C21.2788 16.1403 21.2063 15.9654 21.0773 15.8363L14.8898 9.64885C14.826 9.58493 14.7502 9.53422 14.6667 9.49962C14.5832 9.46502 14.4938 9.44721 14.4034 9.44721C14.3131 9.44721 14.2236 9.46502 14.1402 9.49962C14.0567 9.53422 13.9809 9.58493 13.917 9.64885L10.9659 12.6008L4.37538 6.01025H8.21593C8.39826 6.01025 8.57313 5.93782 8.70206 5.80889C8.83099 5.67996 8.90343 5.50509 8.90343 5.32275C8.90343 5.14042 8.83099 4.96555 8.70206 4.83662C8.57313 4.70769 8.39826 4.63525 8.21593 4.63525H2.71593C2.53359 4.63525 2.35872 4.70769 2.22979 4.83662C2.10086 4.96555 2.02843 5.14042 2.02843 5.32275Z" fill="#0F9581" />
            </svg>;
            displayText = `${percentage}%`;
          } else if (percentage == 75) {
            colorClass = 'medium-attendance';
            icon = <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M19.9033 14.25C19.9033 14.4323 19.8309 14.6072 19.702 14.7361C19.573 14.8651 19.3982 14.9375 19.2158 14.9375H4.09082C3.90848 14.9375 3.73362 14.8651 3.60468 14.7361C3.47575 14.6072 3.40332 14.4323 3.40332 14.25C3.40332 14.0677 3.47575 13.8928 3.60468 13.7639C3.73362 13.6349 3.90848 13.5625 4.09082 13.5625H19.2158C19.3982 13.5625 19.573 13.6349 19.702 13.7639C19.8309 13.8928 19.9033 14.0677 19.9033 14.25ZM4.09082 9.4375H19.2158C19.3982 9.4375 19.573 9.36507 19.702 9.23614C19.8309 9.1072 19.9033 8.93234 19.9033 8.75C19.9033 8.56766 19.8309 8.3928 19.702 8.26386C19.573 8.13493 19.3982 8.0625 19.2158 8.0625H4.09082C3.90848 8.0625 3.73362 8.13493 3.60468 8.26386C3.47575 8.3928 3.40332 8.56766 3.40332 8.75C3.40332 8.93234 3.47575 9.1072 3.60468 9.23614C3.73362 9.36507 3.90848 9.4375 4.09082 9.4375Z" fill="#DB992B" />
            </svg>;
            displayText = `${percentage}%`;
          } else {
            colorClass = 'low-attendance';
            icon = <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.02843 17.6978V12.1978C2.02843 12.0154 2.10086 11.8405 2.22979 11.7116C2.35872 11.5827 2.53359 11.5103 2.71593 11.5103C2.89826 11.5103 3.07313 11.5827 3.20206 11.7116C3.33099 11.8405 3.40343 12.0154 3.40343 12.1978V16.0383L10.4795 8.96135C10.5434 8.89743 10.6192 8.84672 10.7027 8.81212C10.7861 8.77752 10.8756 8.75971 10.9659 8.75971C11.0563 8.75971 11.1457 8.77752 11.2292 8.81212C11.3127 8.84672 11.3885 8.89743 11.4523 8.96135L14.4034 11.9133L20.1045 6.21135C20.2335 6.08234 20.4085 6.00987 20.5909 6.00987C20.7734 6.00987 20.9483 6.08234 21.0773 6.21135C21.2063 6.34035 21.2788 6.51532 21.2788 6.69775C21.2788 6.88019 21.2063 7.05516 21.0773 7.18416L14.8898 13.3717C14.826 13.4356 14.7502 13.4863 14.6667 13.5209C14.5832 13.5555 14.4938 13.5733 14.4034 13.5733C14.3131 13.5733 14.2236 13.5555 14.1402 13.5209C14.0567 13.4863 13.9809 13.4356 13.917 13.3717L10.9659 10.4197L4.37538 17.0103H8.21593C8.39826 17.0103 8.57313 17.0827 8.70206 17.2116C8.83099 17.3405 8.90343 17.5154 8.90343 17.6978C8.90343 17.8801 8.83099 18.055 8.70206 18.1839C8.57313 18.3128 8.39826 18.3853 8.21593 18.3853H2.71593C2.53359 18.3853 2.35872 18.3128 2.22979 18.1839C2.10086 18.055 2.02843 17.8801 2.02843 17.6978Z" fill="#D93D1E" />
            </svg>;
            displayText = `${percentage}%`;
          }

          return (
            <span className={`attendance-badge ${colorClass}`}>
              {displayText && <span className="attendance-number">{displayText}</span>}
              {icon}
            </span>
          );
        }
      }
    ];

    useEffect(() => {
      const handleResize = () => {
        setIsMobile(window.innerWidth <= 768);
      };
      window.addEventListener("resize", handleResize);
      return () => window.removeEventListener("resize", handleResize);
    }, []);

    // Handle photo change
    const handlePhotoChange = (event) => {
      const file = event.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onloadend = () => {
          setProfileImage(reader.result);
          // TODO: Upload to CRM/Database when connected
          console.log('Photo selected:', file.name);
        };
        reader.readAsDataURL(file);
      }
    };

    // Handle photo delete
    const handlePhotoDelete = () => {
      setProfileImage(null);
      // TODO: Delete from CRM/Database when connected
      console.log('Photo deleted');
    };

    // Trigger file input
    const triggerFileInput = () => {
      document.getElementById('profile-photo-input').click();
    };

    // Profile data - use currentUser from Redux for own profile, or fetch from API for others
    const [profileData, setProfileData] = useState({
      fullName: "",
      birthDate: "",
      gender: "",
      email: "",
      phone: "",
      emergencyPhone: "",
      address: "",
      joiningDate: "",
      kenName: ""
    });

    // Load profile data - localStorage first, then Redux
    useEffect(() => {
      // If viewing own profile
      if (isMyProfile && currentUser) {
        console.log('👤 Using currentUser from Redux:', currentUser);
        setProfileData({
          fullName: currentUser.fullName || '',
          birthDate: currentUser.birthdate ? new Date(currentUser.birthdate).toLocaleDateString('he-IL') : '',
          gender: currentUser.sho_pl_gender || '',
          email: currentUser.emailaddress1 || currentUser.email || '',
          phone: currentUser.mobilephone || currentUser.phone || '',
          emergencyPhone: currentUser.sho_s_person_details_for_disaster || '',
          address: currentUser.address1_line1 || '',
          joiningDate: currentUser.zooz_joining_date ? new Date(currentUser.zooz_joining_date).toLocaleDateString('he-IL') : '',
          kenName: ''
        });
        setLoading(false);
        return;
      }

      // If viewing instructor profile
      if (viewId) {
        // Fetch fresh data from API
        // This fixes the issue where Redux data gets overwritten by the students list
        const fetchInstructorDetails = () => {
          console.log('🔄 Fetching full instructor details from API...');
          webapi.safeAjax({
            type: 'GET',
            contentType: 'application/json',
            url: `/_api/contacts(${viewId})?$select=firstname,lastname,birthdate,sho_pl_gender,emailaddress1,mobilephone,sho_s_person_details_for_disaster,address1_line1,zooz_joining_date,contactid`,
            success: function (data) {
              console.log('✅ Fetched instructor details:', data);
              setProfileData({
                fullName: (data.firstname || '') + ' ' + (data.lastname || ''),
                birthDate: data.birthdate ? new Date(data.birthdate).toLocaleDateString('he-IL') : '',
                gender: data.sho_pl_gender || '',
                email: data.emailaddress1 || '',
                phone: data.mobilephone || '',
                emergencyPhone: data.sho_s_person_details_for_disaster || '',
                address: data.address1_line1 || '',
                joiningDate: data.zooz_joining_date ? new Date(data.zooz_joining_date).toLocaleDateString('he-IL') : '',
                kenName: ''
              });
              setLoading(false);
            },
            error: function (xhr, status, error) {
              console.error('❌ Error fetching instructor details:', error);
              setError('לא ניתן לטעון את פרטי המדריך');
              setLoading(false);
            }
          });
        };

        fetchInstructorDetails();
      }
    }, [isMyProfile, currentUser, viewId]);

    // Debug logging for table visibility
    useEffect(() => {
      console.log('📊 Table Visibility Debug:', {
        isCoordinator,
        viewType,
        viewId,
        willShowTable: Boolean(isCoordinator && viewType === 'instructor' && viewId)
      });
    }, [isCoordinator, viewType, viewId]);




    // Map profile field names to Dataverse field names
    const fieldMapping = {
      birthDate: 'birthdate',
      gender: 'sho_pl_gender',
      email: 'emailaddress1',
      phone: 'mobilephone',
      emergencyPhone: 'sho_s_person_details_for_disaster',
      address: 'address1_line1',
      joiningDate: 'zooz_joining_date'
    };

    // Save field handler - saves to Dataverse API
    const handleSaveField = async (fieldName, value) => {
      console.log(`💾 Saving ${fieldName}:`, value);
      setSaving(true);

      try {
        const contactId = viewId || currentUser?.id;

        if (!contactId) {
          throw new Error('No contact ID available');
        }

        // Build the record object
        const record = {};

        // Handle fullName specially (split to firstname/lastname)
        if (fieldName === 'fullName') {
          const names = value.trim().split(/\s+/); // Split by any whitespace
          record.firstname = names[0] || '';
          record.lastname = names.length > 1 ? names.slice(1).join(' ') : '';
        } else {
          const dataverseField = fieldMapping[fieldName];
          if (dataverseField) {
            record[dataverseField] = value;
          }
        }

        // Make API call
        await new Promise((resolve, reject) => {
          webapi.safeAjax({
            type: 'PATCH',
            contentType: 'application/json',
            url: `/_api/contacts(${contactId})`,
            data: JSON.stringify(record),
            success: function (data, textStatus, xhr) {
              console.log('✅ Record updated successfully');
              resolve(data);
            },
            error: function (xhr, textStatus, errorThrown) {
              console.error('❌ Error updating record:', errorThrown);
              reject(errorThrown || 'Failed to save field');
            }
          });
        });

        // Update local state after successful save
        setProfileData(prev => ({
          ...prev,
          [fieldName]: value
        }));

        console.log('✅ Field saved successfully!');
      } catch (err) {
        console.error('❌ Save error:', err);
        throw err; // Re-throw so EditableField can handle it
      } finally {
        setSaving(false);
      }
    };
    useEffect(() => {
      if (userPermissions.canViewCoordinatorsStats && typeof window.fetchActiveInstructors === 'function' && currentUser?.id) {
        console.log('👨‍🏫 Fetching active instructors for coordinator:', currentUser.id);
        dispatch(window.fetchActiveInstructors(currentUser.id));
      }
    }, [dispatch, userPermissions.canViewCoordinatorsStats, currentUser?.id]);

    return (
      <div className="page-layout">
        {!isMobile && <SidebarMenu />}
        <div className={`profile-page-container ${!isMobile ? "main-content" : ""}`}>
          <div className="profile-content">

            {/* Page Header */}
            <div className="profile-header">
              <h1>{isMyProfile ? 'הפרופיל שלי' : (profileData.fullName || 'פרטי משתמש')}</h1>
            </div>

            {/* Loading State */}
            {loading && (
              <div className="loading-message" >
                🔄 טוען נתוני פרופיל...
              </div>
            )}

            {/* Error State */}
            {error && (
              <div className="error-message">
                ❌ {error}
              </div>
            )}

            {/* Content - only show when not loading */}
            {!loading && (
              <>
                {/* Profile Picture Section */}
                <div className="profile-picture-section">
                  <div className="profile-picture-wrapper">
                    {profileImage ? (
                      <img src={profileImage} alt="Profile" className="profile-picture" />
                    ) : (
                      <svg className="profile-picture-placeholder" width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M120 60C120 79.0128 111.157 95.9602 97.358 106.953C87.1088 115.12 74.1239 120 60 120C45.8761 120 32.8912 115.12 22.642 106.953C8.84336 95.9602 0 79.0128 0 60C0 26.8633 26.8633 0 60 0C93.1367 0 120 26.8633 120 60Z" fill="#CEDED7" />
                      </svg>
                    )}


                  </div>

                  {canEdit && (
                    <div className="profile-picture-actions">
                      <button className="btn-change-photo" onClick={triggerFileInput}>
                        החלפת תמונה
                      </button>

                      <button className="btn-delete-photo" onClick={handlePhotoDelete}>
                        מחיקה
                      </button>
                    </div>
                  )}

                  {canEdit && (
                    <input
                      type="file"
                      id="profile-photo-input"
                      className="hidden-file-input"
                      accept="image/jpeg,image/jpg,image/png,image/svg+xml"
                      onChange={handlePhotoChange}
                    />
                  )}
                </div>

                {/* Form Sections */}
                <div className="profile-form-sections">

                  {/* Section 1: Basic Information */}
                  <div className="form-section">
                    <h2 className="section-title">מידע בסיסי</h2>

                    <EditableField
                      label="שם מלא"
                      value={profileData.fullName}
                      fieldName="fullName"
                      onSave={handleSaveField}
                      type="text"
                      canEdit={canEdit}
                    />

                    <EditableField
                      label="תאריך לידה"
                      value={profileData.birthDate}
                      fieldName="birthDate"
                      onSave={handleSaveField}
                      type="text"
                      canEdit={canEdit}
                    />

                    <EditableField
                      label="מין"
                      value={profileData.gender}
                      fieldName="gender"
                      onSave={handleSaveField}
                      type="text"
                      canEdit={canEdit}
                    />
                  </div>

                  {/* Section 2: Contact Information */}
                  <div className="form-section">
                    <h2 className="section-title">פרטי התקשרות</h2>

                    <EditableField
                      label="כתובת אימייל"
                      value={profileData.email}
                      fieldName="email"
                      onSave={handleSaveField}
                      type="email"
                      canEdit={canEdit}
                    />

                    <EditableField
                      label="טלפון נייד"
                      value={profileData.phone}
                      fieldName="phone"
                      onSave={handleSaveField}
                      type="tel"
                      canEdit={canEdit}
                    />

                    <EditableField
                      label="טלפון נייד לחירום (הורה)"
                      value={profileData.emergencyPhone}
                      fieldName="emergencyPhone"
                      onSave={handleSaveField}
                      type="tel"
                      canEdit={canEdit}
                    />

                    <EditableField
                      label="כתובת"
                      value={profileData.address}
                      fieldName="address"
                      onSave={handleSaveField}
                      type="text"
                      canEdit={canEdit}
                    />
                  </div>

                  {/* Section 3: Role Information */}
                  <div className="form-section">
                    <h2 className="section-title">פרטי תפקיד</h2>

                    <EditableField
                      label="תאריך הצטרפות לקן"
                      value={profileData.joiningDate}
                      fieldName="joiningDate"
                      onSave={handleSaveField}
                      type="text"
                      canEdit={canEdit}
                    />

                    <EditableField
                      label="קן"
                      value={profileData.kenName}
                      fieldName="kenName"
                      onSave={handleSaveField}
                      type="text"
                      canEdit={canEdit}
                    />
                  </div>

                </div>

                {/* Trainees Table - only show if coordinator viewing instructor */}
                {isCoordinator && viewType === 'instructor' && viewId && (
                  <div className="trainees-table-section" >
                    <UnifiedDataTable
                      columns={traineesColumns}
                      data={traineesData}
                      title="חניכים/ות של המדריך"
                      search={traineesSearch}
                      setSearch={setTraineesSearch}
                      searchPlaceholder="חיפוש חניך/ה"
                      mode="basic"
                      disableAutoFetch={true}
                    />
                  </div>
                )}
              </>
            )}
            {/* End of loading condition */}

          </div>
        </div>
      </div>
    );
  };

  // Render the app
  const rootElement = document.getElementById("profile-root");
  if (rootElement) {
    // Use global store (same as Home page)
    const storeToUse = typeof store !== 'undefined' ? store : window.store;

    if (ReactDOM.createRoot) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <Provider store={storeToUse}>
          <ProfilePage />
        </Provider>
      );
    } else {
      ReactDOM.render(
        <Provider store={storeToUse}>
          <ProfilePage />
        </Provider>,
        rootElement
      );
    }
  }
</script>
<div id="profile-root"></div>
<div class="row sectionBlockLayout text-start"
  style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;">
    <div class="col-lg-12 columnBlockLayout"
      style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;"></div>
  </div>
</div>
