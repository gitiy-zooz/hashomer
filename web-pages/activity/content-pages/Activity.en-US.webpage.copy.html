<script src="https://cdn.jsdelivr.net/npm/fullcalendar/index.global.min.js"></script>

<script type="text/babel">
    const Activities = () => {
        const { useSelector, useDispatch } = window.ReactRedux;
        const dispatch = useDispatch();

        const activities = useSelector(state => state?.activities?.data || []);
        const trainees = useSelector(state => state?.trainees?.data || []);
        const [searchTerm, setSearchTerm] = React.useState("");
        const [isMobile, setIsMobile] = React.useState(window.innerWidth <= 768);
        const [viewMode, setViewMode] = React.useState('list'); // 'list' או 'calendar'

        // useEffect לטיפול ב-responsive
        React.useEffect(() => {
            const handleResize = () => {
                setIsMobile(window.innerWidth <= 768);
            };
            window.addEventListener("resize", handleResize);
            return () => window.removeEventListener("resize", handleResize);
        }, []);

        React.useEffect(() => {
            if (typeof fetchActivitiesData === 'function') {
                dispatch(fetchActivitiesData());
            }
            if (typeof fetchTraineesData === 'function') {
                dispatch(fetchTraineesData());
            }
        }, [dispatch]);

        // פונקציות עזר לסינון ומיון
        const filterFutureActivities = (activities) => {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            return activities.filter(activity => {
                const activityDate = new Date(activity.startDate);
                return activityDate >= today;
            });
        };

        const sortActivitiesByDate = (activities) => {
            return activities.sort((a, b) => {
                return new Date(a.startDate) - new Date(b.startDate);
            });
        };

        // חישוב נתונים לסטטוס קארדים
        const futureActivitiesCount = React.useMemo(() => {
            return filterFutureActivities(activities).length;
        }, [activities]);

        const nextActivity = React.useMemo(() => {
            const futureActivities = filterFutureActivities(activities);
            const sorted = sortActivitiesByDate([...futureActivities]);
            return sorted[0] || null;
        }, [activities]);

        // Calculate registration percentage for current month
        const registrationPercentage = React.useMemo(() => {
            const now = new Date();
            const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const currentMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);

            // Filter activities from current month
            const currentMonthActivities = activities.filter(activity => {
                const activityDate = new Date(activity.startDate);
                return activityDate >= currentMonthStart && activityDate <= currentMonthEnd;
            });

            if (currentMonthActivities.length === 0) return "0%";

            // Count active trainees
            const activeTraineesCount = trainees.filter(t => t.zooz_status1 === 696480000).length;
            
            if (activeTraineesCount === 0) return "0%";

            // Sum up total participants from all activities
            const totalRegistered = currentMonthActivities.reduce((sum, activity) => {
                return sum + (activity.totalParticipants || 0);
            }, 0);

            // Total possible = active trainees × number of activities
            const totalPossible = activeTraineesCount * currentMonthActivities.length;
            
            if (totalPossible === 0) return "0%";
            
            const percentage = Math.round((totalRegistered / totalPossible) * 100);
            return `${percentage}%`;
        }, [activities, trainees]);

        // פונקציה לכותרות חודשים בעברית
        const getHebrewMonthYear = (year, month) => {
            const hebrewMonths = {
                1: 'ינואר', 2: 'פברואר', 3: 'מרץ', 4: 'אפריל',
                5: 'מאי', 6: 'יוני', 7: 'יולי', 8: 'אוגוסט',
                9: 'ספטמבר', 10: 'אוקטובר', 11: 'נובמבר', 12: 'דצמבר'
            };
            return `${hebrewMonths[month]} `;
        };

        // פונקציה לשמות ימים בעברית
        const getHebrewDayName = (dateString) => {
            const date = new Date(dateString);
            const hebrewDays = {
                0: 'ראשון', 1: 'שני', 2: 'שלישי', 3: 'רביעי',
                4: 'חמישי', 5: 'שישי', 6: 'שבת'
            };
            return hebrewDays[date.getDay()];
        };

        // פונקציה לבדיקה אם זה היום
        const isToday = (dateString) => {
            const today = new Date();
            const date = new Date(dateString);
            return today.toDateString() === date.toDateString();
        };

        // סינון, מיון וקיבוץ פעילויות מעודכן
        const filteredAndSortedActivities = React.useMemo(() => {
            const searchFiltered = activities.filter(activity =>
                activity.title.toLowerCase().includes(searchTerm.toLowerCase())
            );
            const futureActivities = filterFutureActivities(searchFiltered);
            return sortActivitiesByDate(futureActivities);
        }, [activities, searchTerm]);

        const groupedActivities = React.useMemo(() => {
            return filteredAndSortedActivities.reduce((groups, activity) => {
                const date = new Date(activity.startDate);
                const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;

                if (!groups[monthKey]) {
                    groups[monthKey] = [];
                }
                groups[monthKey].push(activity);
                return groups;
            }, {});
        }, [filteredAndSortedActivities]);

                      </svg>
                    </a>

                            <div className="activities-list">
                                {Object.keys(groupedActivities)
                                    .sort()
                                    .map((monthKey) => {
                                        const [year, month] = monthKey.split("-");

                                        return (
                                            <div key={monthKey} className="month-section">
                                                <h4 className="month-title">
                                                    {getHebrewMonthYear(parseInt(year), parseInt(month))}
                                                </h4>

                                                {groupedActivities[monthKey]
                                                    .sort((a, b) => new Date(a.startDate) - new Date(b.startDate))
                                                    .map((activity) => (
                                                        <div 
                                                            key={activity.id} 
                                                            className="activity-row"
                                                            onClick={() => window.location.href = `/activity-detail?id=${activity.id}`}
                                                        >
                                                            <div className="activity-info">
                                                                <div className="activity-name">
                                                                    {activity.title}
                                                                    <Tag tag={activity.tag} />

                                                                </div>
                                                                <div className="activity-time">
                                                                    {activity.startTime} - {activity.endTime}
                                                                </div>
                                                            </div>

                                                            <div className="activity-date-badge">
                                                                <div className="date-display">
                                                                    <div className="day-name">
                                                                        {getHebrewDayName(activity.startDate)}
                                                                    </div>
                                                                    <div className={`date-number ${isToday(activity.startDate) ? 'today' : ''}`}>
                                                                        {new Date(activity.startDate).getDate()}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                            </div>
                                        );
                                    })}

                                </div>

                                            <input type="checkbox" />

            </div>

        );
    };

    const rootElement = document.getElementById("root");
    if (rootElement) {
        const AppWithProvider = () => (
            <ReactRedux.Provider store={store}>
                <Activities />
            </ReactRedux.Provider>
        );

        if (ReactDOM.createRoot) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<AppWithProvider />);
        } else {
            ReactDOM.render(<AppWithProvider />, rootElement);
        }
    }
</script>

<div class="sectionBlockLayout">
