<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Heebo&amp;display=swap" rel="stylesheet" />
<script type="text/babel">

  const { useState, useEffect, useRef } = React;
  const { Provider, useSelector, useDispatch } = window.ReactRedux;

  const Input = ({ label, required, helpText, isDisabled, ...props }) => (
    <div className={`form-control ${isDisabled =="true" ? "disabled" : ""}` }>
      <label className={required ? "required" : ""}>{label}</label>
      <input className="selectField" {...props} />
      {helpText &&
      <small>{helpText}</small>
      }
    </div>
  );

  const TextArea = ({ label, required, helpText, isDisabled, ...props }) => (
    <div className={`form-control ${isDisabled =="true" ? "disabled" : ""}` }>
      <label className={required ? "required" : ""}>{label}</label>
      <textarea className="selectField" rows="4" {...props} />
      {helpText &&
      <small>{helpText}</small>
      }
    </div>
  );

  const Select = ({ label, required, helpText, ...props }) => (
    <div className="form-control">
      <label className={required ? "required" : ""}>{label}</label>
      <select className="selectField" {...props}>
        <option value="">בחירה מרשימה</option>
        <option value="opt1">אפשרות 1</option>
        <option value="opt2">אפשרות 2</option>
      </select>
      {helpText &&
      <small>{helpText}</small>
      }
    </div>
  );

  const YesNo = ({ label, name, value, required, onChange }) => (
    <div className="yesno form-control">
      <label className={required ? "required" : ""}>{label}</label>
      <div>
        <button type="button" className={value === "yes" ? "active" : ""} onClick={() => onChange({ target: { name, value: "yes" } })}>כן</button>
        <button type="button" className={value === "no" ? "active" : ""} onClick={() => onChange({ target: { name, value: "no" } })}>לא</button>
      </div>
    </div>
  );


  const SafetyEventForm = () => {
    const [form, setForm] = useState({
      reporterType: "",
      district: "",
      eventDate: "",
      eventHour: "",
      eventMinute: "",
      location: "",
      injuredName: "",
      injuredId: "",
      injuredPhone: "",
      medicalNeeded: "",
      medicalDetails: "",
      insuranceReported: "",
      insuranceDetails: "",
      shortDesc: "",
      fullDesc: "",
      witnesses: "",
      files: []
    });

    const handleChange = (e) => {
      const { name, value } = e.target;
      setForm((p) => ({ ...p, [name]: value }));
    };

    const handleFile = (e) => {
      setForm((p) => ({ ...p, files: [...e.target.files] }));
    };

    return (
      <div className="safetyform-container">

        <form className="safety-form" dir="rtl">
          <div className="safetySection">
            <h2 className="form-title">פרטי המדווח</h2>
            <div className="reporterDetails">
              <Input label="שם המדווח" type="text" value="אאא" />

              <Input label="כתובת מייל" type="text" value="a@a.com" />
              <Input label="קהילת נוער" type="text" value="גגג" />

          </div>
          <div className="safetySection">
            <h2 className="form-title">פרטי האירוע</h2>
            <div className="form-row">
              <Select label="סיווג האירוע" name="reporterType" value={form.reporterType} onChange={handleChange} required="true"/>

              name="insuranceReported"
              value={form.insuranceReported}
              required="true"
              onChange={handleChange}
            />
            <Input label="פירוט פרטי הפינוי(יש לציין את שם המוקד הרפואי)" name="insuranceDetails" value={form.insuranceDetails} required="true" onChange={handleChange} isDisabled={form.insuranceReported != "yes" ? "true" : "false" } helpText='יש לציין ע"ג איזה רכב פונה הפצוע, לאיזה מוקד רפואי ומה המשך הטיפול בו. אם אין, ניתן לכתוב "אין"'/>

            <Input label="תיאור בקצרה של האירוע" name="shortDesc" value={form.shortDesc} required="true" onChange={handleChange} helpText="שימו לב, תיאור זה צריך להיות חד ושיציג למנהלים את שאירע בלי לציין שמות ונתונים שהוזנו כבר בטופס (עד 15 מילים)" />
            <TextArea label="תיאור מפורט של האירוע ומסקנות (שימו לב! טופס זה אינו תחקיר האירוע)" name="fullDesc" value={form.fullDesc} onChange={handleChange} helpText="פה ניתן לספר ביתר פירוט את שארע כולל רקע גורמים תורמים ולקח ראשוני"/>
            <TextArea label="עדים למקרה" name="witnesses" value={form.witnesses} required="true" onChange={handleChange} helpText="פרטים אישיים של עדי ראייה, מגישי עזרה ראשונה והאחראים במקום, כולל גורמי חוץ, תפקידם ומספר טלפון"/>
          </div>
          {/* Files */}
          <div className="safetySection">
            <h2 className="form-title">העלאת מסמכים</h2>
            <div className="file-upload">
              <label>העלאת מסמכים</label>
              <input type="file" multiple onChange={handleFile} />
            </div>
          </div>

          <button type="submit" className="submit-btn">שליחת דיווח</button>
        </form>
      </div>
    );

                <h1 className="page-title">דיווח אירוע בטיחות</h1>

              </div>
            </header>


            {/* Main Content */}
            <div className="pageContent">
              <SafetyEventForm />

          </div>
        </div>

    )
  }


  // Wait for Redux store to be available and render the app
  const renderApp = () => {
    const rootElement = document.getElementById("root");

    // Use global store if local store is not available
    const storeToUse = typeof store !== 'undefined' ? store : window.store;

    if (rootElement && !rootElement._reactRoot) {
      const root = ReactDOM.createRoot(rootElement);
      rootElement._reactRoot = root;
      root.render(
        <Provider store={storeToUse}>
          <SafetyReportFormPage />
        </Provider>
      );
    } else if (rootElement && rootElement._reactRoot) {
      // Use existing root
      rootElement._reactRoot.render(
        <Provider store={storeToUse}>
          <SafetyReportFormPage />
        </Provider>
      );
    }
  };
