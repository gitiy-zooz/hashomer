<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar/index.global.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo&display=swap" rel="stylesheet" />

<script type="text/babel">
  const ActivitiesHistory = () => {

    const { useSelector, useDispatch } = window.ReactRedux;
    const dispatch = useDispatch();

    const activities = useSelector(state => state.activities?.data || []);
    const [searchTerm, setSearchTerm] = React.useState("");
    const [isMobile, setIsMobile] = React.useState(window.innerWidth <= 768);
    const [openMenuId, setOpenMenuId] = React.useState(null);
    const [activityTypes, setActivityTypes] = React.useState([]);
    const [isDropdownOpen, setIsDropdownOpen] = React.useState(false);
    const [selectedTagName, setSelectedTagName] = React.useState(null);

    React.useEffect(() => {
      const handleResize = () => {
        setIsMobile(window.innerWidth <= 768);
      };
      window.addEventListener("resize", handleResize);
      return () => window.removeEventListener("resize", handleResize);
    }, []);

    React.useEffect(() => {
      if (typeof fetchActivitiesData === 'function') {
        dispatch(fetchActivitiesData());
      }
    }, [dispatch]);

    // שליפת סוגי פעילויות (tags)
    React.useEffect(() => {
      console.log('בודק אם webapi זמין:', typeof webapi);
      if (typeof webapi !== 'undefined' && typeof webapi.safeAjax === 'function') {
        console.log('שולח בקשה לשליפת סוגי פעילויות...');
        webapi.safeAjax({
          type: "GET",
          url: "/_api/zooz_activity_types?$select=zooz_activity_typeid,zooz_name",
          contentType: "application/json",
          headers: {
            "Prefer": "odata.include-annotations=*"
          },
          success: function (data) {
            console.log('תשובה מה-API:', data);
            const types = data.value.map(item => ({
              id: item.zooz_activity_typeid,
              name: item.zooz_name
            }));
            setActivityTypes(types);
            console.log('סוגי פעילויות נשמרו ב-state:', types);
          },
          error: function (xhr, textStatus, errorThrown) {
            console.error('שגיאה בשליפת סוגי פעילויות:', xhr, textStatus, errorThrown);
          }
        });
      } else {
        console.warn('webapi לא זמין עדיין. מנסה שוב ב-500ms...');
        setTimeout(() => {
          if (typeof webapi !== 'undefined' && typeof webapi.safeAjax === 'function') {
            console.log('ניסיון שני - שולח בקשה...');
            webapi.safeAjax({
              type: "GET",
              url: "/_api/zooz_activity_types?$select=zooz_activity_typeid,zooz_name",
              contentType: "application/json",
              headers: {
                "Prefer": "odata.include-annotations=*"
              },
              success: function (data) {
                const types = data.value.map(item => ({
                  id: item.zooz_activity_typeid,
                  name: item.zooz_name
                }));
                setActivityTypes(types);
                console.log('סוגי פעילויות (ניסיון 2):', types);
              },
              error: function (xhr, textStatus, errorThrown) {
                console.error('שגיאה בניסיון שני:', xhr);
              }
            });
          }
        }, 500);
      }
    }, []);

    // סגירת תפריט בלחיצה מחוץ לו
    React.useEffect(() => {
      const handleClickOutside = (e) => {
        if (openMenuId !== null && !e.target.closest('.more-menu-wrap')) {
          setOpenMenuId(null);
        }
        if (isDropdownOpen && !e.target.closest('.all-activities-btn') && !e.target.closest('.tag-dropdown')) {
          setIsDropdownOpen(false);
        }
      };
      document.addEventListener('mousedown', handleClickOutside);
      return () => document.removeEventListener('mousedown', handleClickOutside);
    }, [openMenuId, isDropdownOpen]);

    const filterPastActivities = (activities) => {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return activities.filter(activity => {
        const activityDate = new Date(activity.startDate);
        return activityDate < today;
      });
    };

    const sortActivitiesByDateDesc = (activities) => {
      return activities.sort((a, b) => {
        return new Date(b.startDate) - new Date(a.startDate);
      });
    };

    const getHebrewMonthYear = (year, month) => {
      const hebrewMonths = {
        1: 'ינואר', 2: 'פברואר', 3: 'מרץ', 4: 'אפריל',
        5: 'מאי', 6: 'יוני', 7: 'יולי', 8: 'אוגוסט',
        9: 'ספטמבר', 10: 'אוקטובר', 11: 'נובמבר', 12: 'דצמבר'
      };
      return `${hebrewMonths[month]} `;
    };

    const getHebrewDayName = (dateString) => {
      const date = new Date(dateString);
      const hebrewDays = {
        0: 'ראשון', 1: 'שני', 2: 'שלישי', 3: 'רביעי',
        4: 'חמישי', 5: 'שישי', 6: 'שבת'
      };
      return hebrewDays[date.getDay()];
    };

    const filteredAndSortedActivities = React.useMemo(() => {
      // 1. קודם כל סנן רק פעילויות שעברו
      const pastActivities = filterPastActivities(activities);
      
      // 2. סינון לפי tag נבחר
      let filtered = pastActivities;
      if (selectedTagName) {
        console.log('Selected Tag Name:', selectedTagName);
        console.log('Past activities tags:', pastActivities.map(a => ({ title: a.title, tagName: a.tag?.label })));
        filtered = filtered.filter(activity => {
          const matches = activity.tag?.label === selectedTagName;
          console.log(`Activity "${activity.title}" - tag.label: ${activity.tag?.label}, matches: ${matches}`);
          return matches;
        });
        console.log('Filtered activities:', filtered.length);
      }
      
      // 3. סינון לפי חיפוש
      filtered = filtered.filter(activity =>
        activity.title.toLowerCase().includes(searchTerm.toLowerCase())
      );
      
      return sortActivitiesByDateDesc(filtered);
    }, [activities, searchTerm, selectedTagName]);

    const groupedActivities = React.useMemo(() => {
      return filteredAndSortedActivities.reduce((groups, activity) => {
        const date = new Date(activity.startDate);
        const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
        if (!groups[monthKey]) {
          groups[monthKey] = [];
        }
        groups[monthKey].push(activity);
        return groups;
      }, {});
    }, [filteredAndSortedActivities]);

    const handleDownloadFiles = (activity) => {
      console.log('Downloading files for:', activity);
    };

    const handlePrint = (activity) => {
      console.log('Printing:', activity);
      window.print();
    };

    const handleDuplicate = (activity) => {
      console.log('Duplicating:', activity);
    };
    // הוסף את הפונקציה הזו ליד handlePrint:
    const handleShare = (activity) => {
      console.log('Sharing:', activity);
      if (navigator.share) {
        navigator.share({
          title: activity.title,
          text: `פעילות: ${activity.title}`,
          url: window.location.href
        }).catch(err => console.log('Error sharing:', err));
      } else {
        // fallback - העתקה ללוח
        navigator.clipboard.writeText(window.location.href);
        alert('הקישור הועתק ללוח');
      }
    };

    const handleTagSelect = (tagName) => {
      setSelectedTagName(tagName);
      setIsDropdownOpen(false);
    };

    const getSelectedTagName = () => {
      return selectedTagName || 'כל הפעולות';
    };

    return (
      <div className="page-layout">
        {!isMobile ? <SidebarMenu /> : <ChatBtnInMobile/>}
        <div className={`activities-main-container ${!isMobile ? "main-content" : ""}`}>
        <div classname="contentDiv">
          <div className="page-header">
            <h1 className="page-title">היסטוריית פעילויות</h1>
            <p className="page-subtitle">מרחב צפון • הגלבוע • עמקים • ק״ן אביטל</p>
          </div>

          <div className="sidebar-section">
            {isMobile ? (
              <>
                <div className="section-top-row-mobile">
                  <h3 className="section-title">פעילויות שהסתיימו</h3>
                  <div className="tag-dropdown-wrapper">
                    <button 
                      className="all-activities-btn"
                      onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                    >
                      <span>{getSelectedTagName()}</span>

                        <path d="M16.9132 8.16305L10.6632 14.4131C10.5762 14.5005 10.4727 14.5698 10.3587 14.6171C10.2447 14.6644 10.1226 14.6888 9.99918 14.6888C9.8758 14.6888 9.75362 14.6644 9.63967 14.6171C9.52571 14.5698 9.42222 14.5005 9.33512 14.4131L3.08512 8.16305C2.909 7.98693 2.81006 7.74806 2.81006 7.49899C2.81006 7.24992 2.909 7.01105 3.08512 6.83493C3.26124 6.65881 3.50011 6.55986 3.74918 6.55986C3.99826 6.55986 4.23713 6.65881 4.41325 6.83493L9.99997 12.4216L15.5867 6.83415C15.7628 6.65803 16.0017 6.55908 16.2507 6.55908C16.4998 6.55908 16.7387 6.65803 16.9148 6.83415C17.0909 7.01027 17.1899 7.24914 17.1899 7.49821C17.1899 7.74728 17.0909 7.98615 16.9148 8.16227L16.9132 8.16305Z" fill="#00466D" />
                      </svg>
                    </button>
                    {isDropdownOpen && (
                      <div className="tag-dropdown">
                        <div 
                          className="tag-dropdown-item"
                          onClick={() => handleTagSelect(null)}
                        >
                          כל הפעולות
                        </div>
                        {activityTypes.map(type => (
                          <div 
                            key={type.id}
                            className="tag-dropdown-item"
                            onClick={() => handleTagSelect(type.name)}
                          >
                            {type.name}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div className="search-row-mobile">
                  <div className="search-input-container">
                    <input
                      type="text"
                      placeholder="חיפוש פעילויות"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="search-input"
                    />
                    <div className="search-icon">
                      <i className="fa-solid fa-search search-icon"></i>
                    </div>
                  </div>
                </div>
              </>
            ) : (
              <div className="section-top-row">
                <h3 className="section-title">פעילויות שהסתיימו</h3>
                <div className="search-and-filter">
                  <div className="search-input-container">
                    <input
                      type="text"
                      placeholder="חיפוש פעילויות"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="search-input"
                    />
                    <div className="search-icon">
                      <i className="fa-solid fa-search search-icon"></i>
                    </div>
                  </div>
                  <div className="tag-dropdown-wrapper">
                    <button 
                      className="all-activities-btn"
                      onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                    >
                      <span>{getSelectedTagName()}</span>
                      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16.9132 8.16305L10.6632 14.4131C10.5762 14.5005 10.4727 14.5698 10.3587 14.6171C10.2447 14.6644 10.1226 14.6888 9.99918 14.6888C9.8758 14.6888 9.75362 14.6644 9.63967 14.6171C9.52571 14.5698 9.42222 14.5005 9.33512 14.4131L3.08512 8.16305C2.909 7.98693 2.81006 7.74806 2.81006 7.49899C2.81006 7.24992 2.909 7.01105 3.08512 6.83493C3.26124 6.65881 3.50011 6.55986 3.74918 6.55986C3.99826 6.55986 4.23713 6.65881 4.41325 6.83493L9.99997 12.4216L15.5867 6.83415C15.7628 6.65803 16.0017 6.55908 16.2507 6.55908C16.4998 6.55908 16.7387 6.65803 16.9148 6.83415C17.0909 7.01027 17.1899 7.24914 17.1899 7.49821C17.1899 7.74728 17.0909 7.98615 16.9148 8.16227L16.9132 8.16305Z" fill="#00466D" />
                      </svg>
                    </button>
                    {isDropdownOpen && (
                      <div className="tag-dropdown">
                        <div 
                          className="tag-dropdown-item"
                          onClick={() => handleTagSelect(null)}
                        >
                          כל הפעולות
                        </div>
                        {activityTypes.map(type => (
                          <div 
                            key={type.id}
                            className="tag-dropdown-item"
                            onClick={() => handleTagSelect(type.name)}
                          >
                            {type.name}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            <div className="activities-list">
              {Object.keys(groupedActivities)
                .sort((a, b) => b.localeCompare(a))
                .map((monthKey) => {
                  const [year, month] = monthKey.split("-");

                  return (
                    <div key={monthKey} className="month-section">
                      <h4 className="month-title">
                        {getHebrewMonthYear(parseInt(year), parseInt(month))}
                      </h4>

                      {groupedActivities[monthKey]
                        .sort((a, b) => new Date(b.startDate) - new Date(a.startDate))
                        .map((activity) => (
                          <div 
                            key={activity.id} 
                            className="activity-row"
                            onClick={() => window.location.href = `/activitieshistory-detail?id=${activity.id}`}
                          >
                            <div className="activity-info">
                              <div className="activity-name">
                                {activity.title}
                                <Tag tag={activity.tag} />
                              </div>
                              <div className="activity-time-wrapper">
                                <span className="time-label">שעה</span>
                                <span className="activity-time">
                                  {activity.startTime} - {activity.endTime}
                                </span>
                                <span className="activity-location-mobile">• ק"ן אביטל</span>
                              </div>
                            </div>

                            {!isMobile && (
                              <div className="activity-actions">
                                <button className="action-icon-btn download-btn" onClick={(e) => { e.stopPropagation(); handleDownloadFiles(activity); }} title="הורדת קבצי הדרכה">
                                  <span className="btn-text">הורדת קבצי הדרכה</span>
                                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">

                                  </svg>
                                </button>

                                  </svg>
                                </button>*/}
                              </div>
                            )}

                            {isMobile && (
                              <div className="more-menu-wrap">
                                <button
                                  className="more-options-btn"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setOpenMenuId(openMenuId === activity.id ? null : activity.id);
